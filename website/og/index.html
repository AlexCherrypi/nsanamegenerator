<!DOCTYPE html>
<html>
<head>
<title>NSA Name Generator</title>
<script src="../random.js"></script>
<style>
.text {
	text-align: center;
	padding-top: 200px;
	font-weight: bold;
	font-size: 60pt;
	font-family: Arial, sans-serif;
	text-decoration: none;
	color: black;
	word-break: break-all;
}
</style>
</head>
<body>
<p class="text" id="text"></p>
<script>
// [word list, how many of its best known words to pick from, weight]
const NOUNS = [['nsgl-animal', 120, 25], ['nsgl-food', 120, 20], ['nsgl-artifact', 250, 15], ['nsgl-plant', 100, 10],
               ['nsgl-body', 40, 10], ['nsgl-person', 200, 10], ['nsgl-object', 50, 5], ['nsgl-phenomenon', 30, 3],
               ['nsgl-substance', 50, 2]]
async function run () {
 let w1, w2
 do {
  // two nouns of different kinds, sometimes one of them vulgar
  const first = choose(NOUNS)
  const second = NOUNS.filter(list => list !== first)
  const swear = Math.random() < vulgar ? (Math.random() < 0.5 ? 1 : 2) : 0
  w1 = await pick(swear === 1 ? [['nsgl-vulgar', 100, 1]] : [first]);
  w2 = await pick(swear === 2 ? [['nsgl-vulgar', 100, 1]] : second);
 } while (!nerd && (w1 + w2).length > 14)
 document.getElementById("text").innerText = (w1 + w2).toUpperCase();
 document.title = 'NSA Name Generator - '+ w1 +' + '+ w2;
}
run().catch(error => {
 console.error(error);
 document.getElementById("text").innerText = 'PLEASE RELOAD';
});
</script>
</body>
</html>
