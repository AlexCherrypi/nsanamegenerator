<!DOCTYPE html>
<html>
<head>
<title>NSA Name Generator</title>
<script src="random.js"></script>
<style>
.text {
	text-align: center;
	padding-top: 200px;
	font-weight: bold;
	font-size: 60pt;
	font-family: Arial, sans-serif;
	text-decoration: none;
	color: black;
	word-break: break-all;
}
</style>
</head>
<body>
<p class="text" id="text"></p>
<script>
// [word list, how many of its best known words are familiar, weight]
const MOODS = [['asl-mood', 220, 1]]
const ADJECTIVES = [['asl-all', 1500, 1], ['asl-pert', 500, 1]]
const NOUNS = [['nsgl-animal', 150, 50], ['nsgl-food', 150, 20], ['nsgl-artifact', 250, 15], ['nsgl-person', 200, 15]]
const VULGAR_ADJECTIVES = [['asl-vulgar', 12, 1]]
const VULGAR_NOUNS = [['nsgl-vulgar', 75, 1]]
async function run () {
 const nerd = marks('nerd', 2), vulgar = marks('vulgar', 2)
 let adjective, noun
 do {
  adjective = await pick(vulgar[0] ? VULGAR_ADJECTIVES : nerd[0] ? ADJECTIVES : MOODS, nerd[0]);
  noun = await pick(vulgar[1] ? VULGAR_NOUNS : NOUNS, nerd[1]);
 } while (await blocked(adjective + noun))
 document.getElementById("text").innerText = adjective + " " + noun;
 document.title = 'NSA Name Generator - ' + adjective + ' ' + noun;
}
run().catch(error => {
 console.error(error);
 document.getElementById("text").innerText = 'Please reload';
});
</script>
</body>
</html>
