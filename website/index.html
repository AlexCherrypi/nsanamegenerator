<!DOCTYPE html>
<html>
<head>
<title>NSA Name Generator</title>
<script src="random.js"></script>
<style>
.text {
	text-align: center;
	padding-top: 200px;
	font-weight: bold;
	font-size: 60pt;
	font-family: Arial, sans-serif;
	text-decoration: none;
	color: black;
	word-break: break-all;
}
</style>
</head>
<body>
<p class="text" id="text"></p>
<script>
async function run () {
 document.getElementById("text").innerText = await random('asl') + " " + await random('nsgl');
}
run().catch(error => {
 console.error(error);
 document.getElementById("text").innerText = 'Please reload';
});
</script>
</body>
</html>
